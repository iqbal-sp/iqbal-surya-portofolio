<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Iqbal Surya - Portfolio</title>
  <meta http-equiv="refresh" content="0; url=option-a-desktop/">
  <style>html,body{margin:0;background:#04163f;color:#fff;font:16px "Noto Sans",system-ui,sans-serif}a{color:#fff}p{padding:16px}</style>
</head>
<body>
  <p><span id="redirect-notice">Opening the portfolio…</span> <a id="redirect-link" href="option-a-desktop/">Open the portfolio</a></p>
  <script>
    let portfolioLanguage;
    try { portfolioLanguage = localStorage.getItem('pf-lang'); } catch (error) { /* storage unavailable */ }
    if (!portfolioLanguage) portfolioLanguage = (navigator.language || 'en').toLowerCase().startsWith('id') ? 'id' : 'en';
    if (portfolioLanguage === 'id') {
      document.documentElement.lang = 'id';
      document.getElementById('redirect-notice').textContent = 'Membuka portofolio…';
      document.getElementById('redirect-link').textContent = 'Buka portofolio';
    }
    location.replace('option-a-desktop/' + location.search + location.hash);
  </script>
</body>
</html>
