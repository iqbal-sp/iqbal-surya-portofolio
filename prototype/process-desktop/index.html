<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One XP window · Process asset preview</title>
<link rel="stylesheet" href="../../asset/Home/process/xp-window/crt.css">
<style>
@font-face{font-family:Noto Sans;src:url(../../asset/fonts/noto-sans-latin.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{font-family:Noto Sans,Arial,sans-serif;color:#1d2a3a;background:#f3f4f0;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}main{max-width:1336px;margin:auto;padding:40px 32px 64px}
header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#486534;margin:0 0 8px}
h1{font-size:38px;letter-spacing:-.04em;margin:0 0 8px}header p{margin:0;font-size:15px;color:#56667d;max-width:680px;line-height:1.6}
button,a{font:inherit}button{cursor:pointer}.switch{white-space:nowrap;border:1px solid #b9c9ea;border-radius:4px;background:white;padding:10px 16px;color:#1d2a3a;font-size:13px}.switch[aria-pressed=true]{background:#e1f3c7;border-color:#78a44d}
.viewer{padding:12px 12px 24px;border-radius:14px;background:linear-gradient(#f8f9fb,#d4d7de 75%,#b3b8c2);box-shadow:0 16px 32px #14294320,0 2px 4px #14294320}
.screen{aspect-ratio:17/10;position:relative;overflow:hidden;border-radius:5px;border:3px solid #4a4f59}
.screen img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.screen img.enter{animation:enter .22s ease-out}
.caption{position:absolute;left:0;right:0;bottom:0;padding:8% 3% 3%;display:flex;gap:14px;align-items:center;color:white;background:linear-gradient(transparent,#0c1a35bf);font-size:18px;font-weight:700;z-index:3}
.caption b{background:linear-gradient(#c2f286,#77b931);color:#1d3519;border:1px solid #638e32;padding:5px 12px;border-radius:4px;font-size:16px;white-space:nowrap}
.controls{display:flex;gap:18px;align-items:center;justify-content:space-between;margin:20px 0 36px}
.remote{display:flex;gap:7px;padding:8px;border-radius:8px;background:#263141;box-shadow:inset 0 2px 3px #0007}
.remote button{width:48px;height:44px;border-radius:5px;border:1px solid #171f2b;font-weight:700;font-size:20px;color:#1d2a3a;background:linear-gradient(white,#c9cdd5)}
.remote button[aria-pressed=true]{background:linear-gradient(#b9ed7a,#70b32c);color:#17300d}.remote button:focus-visible,.switch:focus-visible,a:focus-visible{outline:3px solid #2455bb;outline-offset:4px}
.details h2{margin:0 0 4px;font-size:24px;letter-spacing:-.025em}.details p{margin:0;font-size:14px;color:#56667d}
.downloads{display:flex;gap:16px;align-items:center}.downloads a,.card a{font-size:13px;color:#2455bb;text-decoration:underline;text-underline-offset:4px}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{min-width:0}.thumb{position:relative;aspect-ratio:17/10;overflow:hidden;border-radius:5px}.thumb img{width:100%;height:100%;display:block}.card-info{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}.card h3{margin:0;font-size:15px}.card h3 span{color:#758093;font-size:12px;margin-right:8px}.note{font-size:12px;color:#56667d;line-height:1.7;margin:30px 0 0;max-width:700px}
.render-asset main{max-width:none;padding:0}.render-asset header,.render-asset .controls,.render-asset .board,.render-asset .note,.render-asset .caption{display:none}.render-asset .viewer{padding:0;background:none;box-shadow:none;border-radius:0}.render-asset .screen{border:0;border-radius:0;width:1700px;height:1000px;aspect-ratio:17/10}.render-asset .screen img.enter{animation:none}.render-asset .crt-channel{display:none}
.mode-board .viewer,.mode-board .controls{display:none}.mode-board .board{gap:26px}.mode-board header{margin-bottom:28px}
@keyframes enter{from{opacity:.5}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.screen img.enter{animation:none}}
@media(max-width:700px){main{padding:24px 16px}header{align-items:start;flex-direction:column;gap:16px}h1{font-size:30px}.controls{align-items:start;flex-wrap:wrap}.details{width:100%}.details h2{font-size:21px}.board{grid-template-columns:1fr}.caption{font-size:12px;gap:8px}.caption b{font-size:11px;padding:3px 7px}.downloads{margin-left:auto}.viewer{padding:7px 7px 16px}.remote button{width:40px;height:40px}.screen{border-width:2px}}
</style>
<body class="crt">
<main>
  <header><div><p class="eyebrow">Process assets · Concept 02 / CRT</p><h1>One XP window</h1><p>Four episodes on blue ribbon wallpaper, behind softly textured CRT glass.</p></div><button class="switch" id="crt-toggle" aria-pressed="true">CRT effect: on</button></header>
  <section class="viewer" aria-label="Episode preview"><div class="screen crt-display"><img class="crt-picture" id="active-asset" alt=""><div class="caption"><b id="ep-label"></b><span id="ep-caption"></span></div><div class="crt-surface" aria-hidden="true"><span class="crt-grain"></span><span class="crt-reflection"></span></div><div class="crt-channel" aria-hidden="true"></div></div></section>
  <section class="controls"><div class="details" aria-live="polite"><h2 id="ep-title"></h2><p id="ep-description"></p></div><div class="remote" aria-label="Choose episode"><button data-ep="0" aria-label="Episode 1">1</button><button data-ep="1" aria-label="Episode 2">2</button><button data-ep="2" aria-label="Episode 3">3</button><button data-ep="3" aria-label="Episode 4">4</button></div><div class="downloads"><a id="svg-link" download>SVG</a><a id="png-link" download>PNG</a></div></section>
  <section class="board" id="board" aria-label="All four assets"></section>
  <p class="note">Editable SVG + transparent PNG, 1700 × 1000. Separate wallpaper and CRT layers, plus complete PNG compositions ready to use. All interface content is illustrative.</p>
</main>
<script>
const base='../../asset/Home/process/xp-window/';
const episodes=[
  ['ep1-brief','Agree on the work','Scope, budget, and timeline.','Before we start · News'],
  ['ep2-structure','Map out the pages and flows','Content, wireframes, and key user flows.','Structure · Documentary'],
  ['ep3-review','Review the design','Screens, prototypes, and feedback.','Design and review · Series'],
  ['ep4-handoff','Prepare the final files','Organised files, components, and design notes.','Handoff or build · Premiere']
];
let current=0,hasSelected=false;
function select(i){const next=((i%4)+4)%4;const changed=hasSelected&&next!==current;current=next;const [slug,title,description,caption]=episodes[current];const img=document.getElementById('active-asset');img.src=base+slug+'.svg';img.alt=title;if(changed){img.classList.remove('enter');const screen=document.querySelector('.screen');screen.classList.remove('channel-change');void screen.offsetWidth;img.classList.add('enter');screen.classList.add('channel-change');}document.getElementById('ep-label').textContent='EP '+(current+1);document.getElementById('ep-caption').textContent=caption;document.getElementById('ep-title').textContent=title;document.getElementById('ep-description').textContent=description;document.getElementById('svg-link').href=base+slug+'.svg';document.getElementById('png-link').href=base+slug+'.png';document.querySelectorAll('[data-ep]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.ep)===current)));hasSelected=true;}
document.querySelectorAll('[data-ep]').forEach(b=>b.addEventListener('click',()=>select(Number(b.dataset.ep))));
document.getElementById('crt-toggle').addEventListener('click',e=>{const on=document.body.classList.toggle('crt');e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent='CRT effect: '+(on?'on':'off');});
document.getElementById('board').innerHTML=episodes.map(([slug,title],i)=>`<article class="card"><div class="thumb crt-display"><img class="crt-picture" src="${base+slug}.svg" alt="${title}"><div class="crt-surface" aria-hidden="true"><span class="crt-grain"></span><span class="crt-reflection"></span></div></div><div class="card-info"><h3><span>EP 0${i+1}</span>${title}</h3><a href="${base+slug}-crt.png" download>CRT PNG</a></div></article>`).join('');
const query=new URLSearchParams(location.search);
if(query.has('board'))document.body.classList.add('mode-board');
if(query.has('render'))document.body.classList.add('render-asset');
select(Number(query.get('ep')||1)-1);
document.querySelector('.screen').addEventListener('animationend',e=>{if(e.animationName==='crt-channel-change')e.currentTarget.classList.remove('channel-change');});
document.querySelector('.remote').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();select(current+(e.key==='ArrowRight'?1:-1));document.querySelector(`[data-ep="${current}"]`).focus();}});
</script>
</body>
</html>
