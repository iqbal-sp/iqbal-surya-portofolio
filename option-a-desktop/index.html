  <!-- the loading screen's own rules: the stylesheets come after boot.js, at the foot of the page, so on a slow
       connection the screen draws without waiting for them (the desktop's scripts still do) -->
  <style>
    /* until style.css has arrived only the loading screen shows: the desktop's markup waits unseen on Broadcast Deep */
    html { background: #04163f; }
    :where(body > :not(#boot)) { visibility: hidden; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    /* ============================================================
       LOADING SCREEN (boot.js, crt3d/)
       An old beige PC in a dark room, its CRT running a power-on self test while the portfolio really loads; when
       everything is in, the tube turns XP's welcome blue and the camera flies into the glass. The room is a still of
       the 3D (asset/boot/room.webp, a phone's room-phone.webp) until the 3D takes over; the test is HTML laid on the
       glass with a projective transform (boot.js). The script below shows it (html.booting).
       ============================================================ */
    .boot-screen {
      position: fixed; inset: 0; z-index: 10000;
      display: none; overflow: hidden; background: #141414;
      cursor: progress; user-select: none; -webkit-user-select: none;
    }
    html.booting .boot-screen { display: block; }
    .boot-screen.ready { cursor: default; }
    /* the desktop builds and loads behind the screen but is not painted until the screen starts to leave; then it
       comes up in XP's order: the wallpaper, the taskbar and icons, and the startup window last (boot.js) */
    html.booting:not(.boot-out) :is(.desktop, .taskbar) { visibility: hidden; }
    html.boot-out:not(.boot-in) :is(.desk-icons, #windows, .taskbar) { visibility: hidden; }
    /* the room: the still (dithered by boot.js) covers the screen the way the 3D frames it, and the 3D's canvas takes
       over once it has drawn the same picture; both in 2px dots */
    .boot-scene { position: absolute; inset: 0; }
    .boot-room, .boot-3d { position: absolute; inset: 0; display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .boot-3d { visibility: hidden; }
    .boot-scene.live .boot-3d { visibility: visible; }
    .boot-scene.live .boot-room { visibility: hidden; }
    /* the case's hard-disk lamp on the still, lit a moment as each file arrives (boot.js lays it on the room's dots; the 3D
       lights its own) */
    .boot-led { position: absolute; left: 0; top: 0; background: #ccffcc; visibility: hidden; }
    .boot-led.on { visibility: visible; }
    .boot-scene.live .boot-led { visibility: hidden; }
    /* the tube: the test's own 1024 x 768 box, laid on the glass by boot.js (a matrix3d from its top left corner),
       under the glass the site's CRT draws (.crt-glass): the window's reflection and the tube's dark edge. Not its fine
       lines: scaled onto the glass they beat against the screen's pixels, and the room's dots carry the texture */
    .boot-crt {
      position: absolute; left: 0; top: 0; z-index: 1; width: 1024px; height: 768px; overflow: hidden;
      transform-origin: 0 0; border-radius: 40px; visibility: hidden;
      background: radial-gradient(120% 110% at 50% 45%, #0b0c0d, #020202 70%);
      color: #d8d2bd; font: 400 34px/42px "Noto Sans Mono", monospace;
      text-shadow: 0 0 6px rgba(216, 210, 189, .35);
    }
    /* hidden until boot.js has laid it on the glass (on a slow connection the box would show at the top left first) */
    .boot-crt.laid { visibility: visible; }
    .boot-crt::after {
      content: ""; position: absolute; inset: 0; z-index: 2; border-radius: inherit; pointer-events: none;
      background: radial-gradient(120% 80% at 22% 6%, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 44%), linear-gradient(115deg, rgba(255, 255, 255, 0) 56%, rgba(255, 255, 255, .06) 61%, rgba(255, 255, 255, 0) 68%);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .06);
    }
    /* the self test, English on both languages as a BIOS was: the head, the memory count, one line per part (dim
       until tested, a cursor on the one being tested, then OK or FAILED), XP's green blocks, and a foot line */
    .bios { position: absolute; inset: 0; padding: 44px 56px; }
    .bios p { margin: 0; white-space: pre; }
    .bios-head { color: #fff; font-weight: 700; }
    .bios :is(.bios-mem, .bios-test, .bios-tail) { margin-top: 20px; }
    .bios-test p { display: flex; }
    .bios-test span { flex: none; width: 29ch; overflow: hidden; }
    .bios-test span::after { content: " ............................"; }
    .bios-test p:not([data-state]), .bios-test p[data-state=""] { color: #aca899; }
    .bios-test b { margin-left: 1ch; font-weight: 400; color: #fff; }
    .bios-test p[data-state="failed"] b { font-weight: 700; }
    .bios-test p[data-state="cur"] b::after, .bios-tail:not(:empty)::after { content: "_"; animation: bios-cursor 1.06s steps(1) infinite; }
    @keyframes bios-cursor { 50% { opacity: 0; } }
    .bios-meter { display: flex; align-items: center; gap: 24px; margin-top: 18px; }
    .bios-bar { display: flex; gap: 4px; padding: 5px; border: 2px solid #aca899; }
    .bios-bar i { display: block; width: 14px; height: 26px; background: #2a2d35; }
    .bios-bar i.on { background: #4cda50; }
    .bios-pct { min-width: 4ch; color: #fff; font-weight: 700; text-align: right; }
    .bios-foot { position: absolute; left: 56px; bottom: 24px; color: #aca899; }
    /* everything is in: XP's welcome with no one logging in yet, the blue between its navy bands and their light rules */
    .bios-blue { position: absolute; inset: 0; display: grid; grid-template-rows: 48px 1fr 48px; background: #5a7edc; visibility: hidden; }
    .bios-blue i { position: relative; display: block; }
    .bios-blue i:first-child, .bios-blue i:last-child { background: #00309c; }
    .bios-blue i:first-child::after, .bios-blue i:last-child::before { content: ""; position: absolute; left: 0; right: 0; height: 2px; }
    .bios-blue i:first-child::after { top: 100%; background: linear-gradient(90deg, transparent, #a6c4f7 25%, rgba(166, 196, 247, .5) 60%, transparent); }
    .bios-blue i:last-child::before { bottom: 100%; background: linear-gradient(90deg, transparent, var(--orange-rule) 30%, var(--orange-rule) 70%, transparent); }
    .bios-blue i:nth-child(2) { background: radial-gradient(90% 90% at 0 0, rgba(166, 196, 247, .8), rgba(166, 196, 247, 0) 60%); }
    .boot-crt.blue .bios-blue { visibility: visible; }
    .boot-crt.blue .bios { visibility: hidden; }
    /* a phone shows the whole tube in about 310px: the test half again as large, keeping only the parts and the bar */
    @media (max-width: 720px), (max-height: 500px) and (pointer: coarse) {
      .boot-crt { font-size: 44px; line-height: 54px; }
      .bios { padding: 44px 52px; }
      .bios-copy, .bios-mem, .bios-foot { display: none; }
      .boot-screen.failing .bios-foot { display: block; }
      .bios-test { margin-top: 24px; }
      .bios-test span { width: 27ch; }
      .bios-bar i { width: 22px; height: 38px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bios-test p[data-state="cur"] b::after, .bios-tail:not(:empty)::after { animation: none; }
    }
  </style>

  <script type="importmap">

  <script>
    // before the first paint: the loading screen shows once a session (never under ?preview), in the visitor's language.
    // A link to one window (#/work/krool, #/about …) skips it: whoever follows a shared link came for that window
    (function (r) {
      var seen = null, saved = null;
      try { seen = sessionStorage.getItem('pf-a-boot'); saved = localStorage.getItem('pf-lang'); } catch (e) { /* storage unavailable */ }
      r.lang = saved === 'id' || saved === 'en' ? saved : /^id/i.test(navigator.language || '') ? 'id' : 'en';
      if (seen !== '1' && !/[?&]preview(=|&|$)/.test(location.search) && !/^#\/./.test(location.hash)) r.classList.add('booting');
      // a loading screen whose script never ran must not cover the desktop
      addEventListener('DOMContentLoaded', function () { if (!(window.PF && window.PF.boot)) r.classList.remove('booting'); });
    })(document.documentElement);
  </script>

<body>
<!--
  DIRECTION CONTRACT — Option A "Desktop XP", Home: "Prime Time Guide"
  THESIS: Home is a 2004 Media Center TV-guide ad: the pitch reads as listings, the work plays as features. It refuses the stacked-section landing.
  OWN-WORLD: Luna chrome around a white print page; a brushed-steel hero with the case pages' beige CRT; torn black-ruled newsprint; Media Center blue with green focus glow; a control-room multiviewer; a brushed-steel close with the owner's photo printed beside a New Message window. Noto Sans bold heads, Noto Sans body.
  STORY: A founder reads the offer, scans four slots, watches five features and the shots, flips episodes with the remote, presses Record, and writes the brief as the next programme.
  FIRST VIEWPORT: headline, intro and red Record printed on brushed steel, centred; under them a big CRT monitor playing the owner's photo; a torn four-slot listing below.
  FORM: Prime Time Guide, rank 7 of 7, seed c2b40bb7. Signature: the remote switches episodes. Motion: the CRT powers on once; the multiviewer locks on once.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="selTint" x="0" y="0" width="100%" height="100%">
      <feFlood flood-color="#316ac5" flood-opacity="0.55" result="f"/>
      <feComposite in="f" in2="SourceAlpha" operator="in" result="m"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="m"/></feMerge>
    </filter>
    <!-- Home's broadcast stage: the covers' ordered dither (the Figma matrix, 16 by 16, eight levels a channel)
         over the band's own gradient. Each pixel is nudged by its threshold in the tile, a seventh of a level
         either way, then rounded to the nearest of the eight levels. The tile is 16 dots; app.js sizes it so a
         dot is one screen pixel -->
    <filter id="bcDither" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage id="bcDitherTile" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAAAAACPAi4CAAAAeklEQVR42mNkYGBgaGBgYFgApTPQ+FEE5JkYKAQDbwDLAahfyKWHQxgUQP1iAKVJ5Y+mg+ERBjJQv8RAaR4o7QOlCcmPpoPR8mA0HQyfMGCH+sUdSotD6XAozQylnaG0MJQOHk0Ho+XBaHkw2j4YbR+Mlgej5cFwTQcAqZiC8BWu0FYAAAAASUVORK5CYII=" x="0" y="0" width="16" height="16" preserveAspectRatio="none" result="bayer"/>
      <feTile in="bayer" result="bayers"/>
      <feComposite in="SourceGraphic" in2="bayers" operator="arithmetic" k1="0" k2="1" k3="0.142857" k4="-0.071429" result="nudged"/>
      <feComponentTransfer in="nudged">
        <feFuncR type="discrete" tableValues="0 0.142857 0.142857 0.285714 0.285714 0.428571 0.428571 0.571429 0.571429 0.714286 0.714286 0.857143 0.857143 1"/>
        <feFuncG type="discrete" tableValues="0 0.142857 0.142857 0.285714 0.285714 0.428571 0.428571 0.571429 0.571429 0.714286 0.714286 0.857143 0.857143 1"/>
        <feFuncB type="discrete" tableValues="0 0.142857 0.142857 0.285714 0.285714 0.428571 0.428571 0.571429 0.571429 0.714286 0.714286 0.857143 0.857143 1"/>
      </feComponentTransfer>
    </filter>
  </svg>

  <!--
    LOADING SCREEN (boot.js, crt3d/)
    THESIS: an old beige PC in a dark room boots the portfolio: its CRT runs a power-on self test while the parts really load, then the camera flies into the screen and the desktop comes up. It refuses the spinner-over-a-logo splash and the timed fake bar.
    OWN-WORLD: a late-eighties beige desktop PC with its CRT on a swivel stand, a 101-key keyboard, a mouse and two floppies on near-black felt, modelled in Blender and drawn by three.js through the wallpaper's 216-colour ordered dither in 2px dots; on its glass a BIOS self test in Noto Sans Mono under the site's CRT glass; XP's welcome blue once everything is in.
    STORY: The visitor watches an old computer test each part of the portfolio as it truly arrives. Nothing opens until everything is in, and a part that fails is tried again. Then the tube turns XP blue and the camera flies through the glass onto the desktop, with Home open. No skip and no time limit (owner's requests, 2026-09-28 and 2026-09-29).
    FIRST VIEWPORT: the PC centred in the dark, its screen about a quarter of the window's width with the test legible on it; a phone sees the monitor across its width, the test set larger.
    FORM: shaped directly from the owner's brief (an old computer as the loading moment, 2026-09-29), reviewed as Cycles renders and an animatic before it was built.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div id="boot" class="boot-screen">
    <div class="boot-scene">
      <!-- the still of the 3D's first frame, dithered by boot.js at this window's dots (asset/boot/room.webp, a phone's
           room-phone.webp; prototype/loader-crt/tools/poster.mjs) -->
      <canvas class="boot-room" aria-hidden="true"></canvas>
      <i class="boot-led" aria-hidden="true"></i>
      <div class="boot-crt" aria-hidden="true">
        <div class="bios">
          <p class="bios-head">PORTFOLIO BIOS v2.6</p>
          <p class="bios-copy">Copyright (C) 2026 Iqbal Surya Pratama</p>
          <p class="bios-mem">Memory Test :     0K</p>
          <div class="bios-test"></div>
          <div class="bios-meter"><span class="bios-bar"></span><span class="bios-pct">0%</span></div>
          <p class="bios-tail"></p>
          <p class="bios-foot" data-id="09/29/2026-XP-PORTFOLIO-00">09/29/2026-XP-PORTFOLIO-00</p>
        </div>
        <div class="bios-blue"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div class="sr-only" id="bootMeter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    <p class="sr-only" id="bootSay" role="status"></p>
